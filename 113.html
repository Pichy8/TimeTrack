<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: text;
    }

    body {
      color: #000; /* force black text */
      font-family: monospace;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: pre-line;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .flood {
      position: absolute;
      inset: 0;
      font-size: 1.1rem;
      line-height: 1.4;
      white-space: pre-wrap;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="message" class="message">
PLEASE DONT TRUST HIM
209135 WILL LEAD YOU
  </div>

  <div id="flood" class="flood"></div>

  <audio id="audio" src="lostman.mp3" loop></audio>

  <script>
    const audio = document.getElementById('audio');

    // Force audio playback (with retry)
    function forcePlay() {
      audio.volume = 0.4;
      audio.play().catch(() => {
        setTimeout(forcePlay, 500);
      });
    }
    forcePlay();

    const message = document.getElementById('message');
    const flood = document.getElementById('flood');

    // After 30 seconds, change the message
    setTimeout(() => {
      message.textContent = "No, nothing is wrong.";
    }, 30000);

    // After 32 seconds, begin flooding text
    setTimeout(() => {
      message.style.display = "none";
      flood.style.display = "block";

      let text = "";
      const phrase = "No, nothing is wrong. ";

      const interval = setInterval(() => {
        text += phrase;
        flood.textContent = text;
      }, 120);

    }, 32000);

    // Hard reset after 40 seconds
    setTimeout(() => {
      window.location.href = "Employee Portal.html";
    }, 40000);
  </script>

</body>
</html>
