<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: text;
    }

    body {
      font-family: monospace;
      color: #000; /* text is same color as background */
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: pre-line;
      font-size: 1.2rem;
    }

    .flood {
      position: absolute;
      inset: 0;
      white-space: pre-wrap;
      font-size: 1.1rem;
      line-height: 1.4;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Selectable but invisible text -->
  <div id="message" class="message">
PLEASE DONT TRUST HIM
209135 WILL LEAD YOU
  </div>

  <div id="flood" class="flood"></div>

  <audio id="audio" src="lostman.mp3" loop></audio>

  <script>
    const audio = document.getElementById('audio');
    audio.volume = 0.4;

    // Force audio playback with retry
    function forcePlay() {
      audio.play().catch(() => {
        setTimeout(forcePlay, 500);
      });
    }
    forcePlay();

    const message = document.getElementById('message');
    const flood = document.getElementById('flood');

    /* === 30s: shift === */
    setTimeout(() => {
      message.textContent = "No, nothing is wrong.";

      // Begin subtle audio corruption
      let rate = 1;
      const distort = setInterval(() => {
        rate += (Math.random() * 0.06 - 0.03);
        rate = Math.max(0.85, Math.min(1.15, rate));
        audio.playbackRate = rate;
      }, 600);

    }, 30000);

    /* === 32s: denial flood === */
    setTimeout(() => {
      message.style.display = "none";
      flood.style.display = "block";

      let text = "";
      const phrase = "No, nothing is wrong. ";

      setInterval(() => {
        text += phrase;
        flood.textContent = text;
      }, 110);

    }, 32000);

    /* === 40s: system correction === */
    setTimeout(() => {
      window.location.href = "Employee Portal.html";
    }, 40000);
  </script>

</body>
</html>
